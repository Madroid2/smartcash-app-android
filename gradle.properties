# ── Gradle daemon JVM memory ──────────────────────────────────────────────────
# Compose + Hilt + KSP annotation processing is memory-hungry.
# 4 GB heap + 512 MB Metaspace prevents OutOfMemoryError: Java heap space.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ──────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── Kotlin ─────────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Run KSP in the same daemon JVM (avoids a second large JVM process)
ksp.incremental=true

# ── Android ────────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
